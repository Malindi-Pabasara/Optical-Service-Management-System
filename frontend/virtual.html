<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Glasses Try-On</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0; padding: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background-color: #2c3e50;
            font-family: Arial, sans-serif; color: white;
            height: 100vh;
        }
        #container {
            position: relative;
            width: 640px; height: 480px;
            border: 5px solid #34495e; border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 10px 20px rgba(0,0,0,0.3);
            background-color: #000;
        }
        #webcam {
            display: none;
        }
        #output_canvas {
            width: 100%; height: 100%;
            transform: rotateY(180deg);
        }
        #glasses-container {
            position: absolute;
            display: none;
            pointer-events: none;
            z-index: 10;
            transform-origin: center;
        }
        h2 { margin-bottom: 10px; }
        
        /*  Glasses Selector Styles */
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        .btn {
            background-color: #34495e;
            color: white;
            border: 2px solid #3498db;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover, .btn.active {
            background-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
        }
    </style>
</head>
<body>

    <h2>Virtual Glasses Try-On 🕶️</h2>
    
    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
        
        <div id="glasses-container">
            <svg id="glasses-svg" viewBox="0 0 100 40" width="100%" height="100%"></svg>
        </div>
    </div>

    <div class="controls">
        <button class="btn active" onclick="changeGlasses('classic', this)">Classic Black</button>
        <button class="btn" onclick="changeGlasses('modern', this)">Cool Blue</button>
        <button class="btn" onclick="changeGlasses('aviator', this)">Aviator Gold</button>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const glassesContainer = document.getElementById('glasses-container');
        const glassesSvg = document.getElementById('glasses-svg');

        // Three types of mirror SVG designs.
        const glassesDesigns = {
            classic: `
                <circle cx="25" cy="20" r="15" stroke="black" stroke-width="4" fill="none" />
                <circle cx="25" cy="20" r="13" stroke="rgba(0, 0, 0, 0.1)" stroke-width="1" fill="rgba(0, 0, 0, 0.15)" />
                <circle cx="75" cy="20" r="15" stroke="black" stroke-width="4" fill="none" />
                <circle cx="75" cy="20" r="13" stroke="rgba(0, 0, 0, 0.1)" stroke-width="1" fill="rgba(0, 0, 0, 0.15)" />
                <path d="M 40 20 Q 50 13 60 20" stroke="black" stroke-width="4" fill="none" />
                <path d="M 10 20 Q 5 15 0 25" stroke="black" stroke-width="3" fill="none" />
                <path d="M 90 20 Q 95 15 100 25" stroke="black" stroke-width="3" fill="none" />
            `,
            modern: `
                <rect x="10" y="8" width="32" height="24" rx="5" stroke="#2980b9" stroke-width="3" fill="none" />
                <rect x="12" y="10" width="28" height="20" rx="3" fill="rgba(52, 152, 219, 0.3)" />
                <rect x="58" y="8" width="32" height="24" rx="5" stroke="#2980b9" stroke-width="3" fill="none" />
                <rect x="60" y="10" width="28" height="20" rx="3" fill="rgba(52, 152, 219, 0.3)" />
                <path d="M 42 16 Q 50 10 58 16" stroke="#2980b9" stroke-width="3" fill="none" />
                <path d="M 10 15 L 0 18" stroke="#2980b9" stroke-width="2" fill="none" />
                <path d="M 90 15 L 100 18" stroke="#2980b9" stroke-width="2" fill="none" />
            `,
            aviator: `
                <path d="M 10 12 C 15 8, 35 8, 40 12 C 40 20, 35 32, 25 32 C 15 32, 10 20, 10 12 Z" stroke="#d4af37" stroke-width="2" fill="rgba(212, 175, 55, 0.2)" />
                <path d="M 60 12 C 65 8, 85 8, 90 12 C 90 20, 85 32, 75 32 C 65 32, 60 20, 60 12 Z" stroke="#d4af37" stroke-width="2" fill="rgba(212, 175, 55, 0.2)" />
                <path d="M 40 12 Q 50 8 60 12" stroke="#d4af37" stroke-width="2" fill="none" />
                <path d="M 40 18 Q 50 15 60 18" stroke="#d4af37" stroke-width="1.5" fill="none" />
                <path d="M 10 14 Q 5 12 0 16" stroke="#d4af37" stroke-width="2" fill="none" />
                <path d="M 90 14 Q 95 12 100 16" stroke="#d4af37" stroke-width="2" fill="none" />
            `
        };

        // Default Classic Load 
        glassesSvg.innerHTML = glassesDesigns.classic;

        // A function that changes the mirror when the button is clicked. 
        function changeGlasses(style, buttonElement) {
            glassesSvg.innerHTML = glassesDesigns[style];
            
            // Active button highlight
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
        }

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                const leftEye = landmarks[33];  
                const rightEye = landmarks[263]; 
                const noseBridge = landmarks[168]; 

                const width = canvasElement.clientWidth;
                const height = canvasElement.clientHeight;

                const midX = (1 - noseBridge.x) * width;
                const midY = noseBridge.y * height;

                const eyeDistance = Math.sqrt(
                    Math.pow((rightEye.x - leftEye.x) * width, 2) +
                    Math.pow((rightEye.y - leftEye.y) * height, 2)
                );

                const glassesWidth = eyeDistance * 2.3; 
                const glassesHeight = glassesWidth * 0.4; 

                glassesContainer.style.display = 'block';
                glassesContainer.style.width = glassesWidth + 'px';
                glassesContainer.style.height = glassesHeight + 'px';

                glassesContainer.style.left = (midX - glassesWidth / 2) + 'px';
                glassesContainer.style.top = (midY - glassesHeight / 2) + 'px';

                const angle = Math.atan2((rightEye.y - leftEye.y) * height, (rightEye.x - leftEye.x) * width);
                glassesContainer.style.transform = `rotate(${-angle}rad)`;

            } else {
                glassesContainer.style.display = 'none';
            }
            canvasCtx.restore();
        }

        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onResults);

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 640,
            height: 480
        });
        
        camera.start().catch(err => {
            alert("The camera is not working! Please check the browser permissions.");
            console.error("Camera error:", err);
        });
    </script>
</body>
</html>
